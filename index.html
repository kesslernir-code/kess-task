<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kess-task</title>
  <meta name="theme-color" content="#eef1fa"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Kess-task"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon.svg"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #eef1fa; --surface: #ffffff; --surface2: #f5f6fc;
      --border: #e4e7f3; --border-hover: #c9cef0;
      --text-primary: #1f2544; --text-secondary: #737a9c; --text-muted: #aeb3cc;
      --accent: #5b6cff; --pink: #e84fa6; --red: #ef4d6a;
      --grad: linear-gradient(135deg, #4f7cff, #9b5cf6);
      --shadow: 0 6px 20px rgba(70,82,160,0.08);
      --radius: 16px;
    }
    body { background:var(--bg); color:var(--text-primary); font-family:'Rubik',sans-serif; font-weight:400; min-height:100vh; padding:32px 24px 80px; }
    header { max-width:1080px; margin:0 auto 28px; display:flex; align-items:center; gap:14px; }
    .logo { width:44px; height:44px; flex-shrink:0; }
    .header-label { font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:2px; }
    header h1 { font-size:26px; font-weight:700; color:var(--text-primary); line-height:1.1; }
    header h1 span { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .app { max-width:1080px; margin:0 auto; display:flex; gap:24px; align-items:flex-start; }
    .sidebar { width:220px; flex-shrink:0; position:sticky; top:24px; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 12px; }
    .sidebar-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:0 8px; }
    .sidebar-label { font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); }
    .proj-add-btn { background:var(--surface2); border:none; border-radius:8px; color:var(--accent); cursor:pointer; font-size:18px; line-height:1; width:26px; height:26px; transition:all 0.15s; }
    .proj-add-btn:hover { background:var(--grad); color:#fff; }
    .proj-list { display:flex; flex-direction:column; gap:4px; }
    .proj-item { background:transparent; border:none; border-radius:10px; color:var(--text-secondary); cursor:pointer; font-family:inherit; font-size:14px; padding:10px 12px; text-align:right; transition:all 0.15s; display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; position:relative; }
    .proj-item:hover { background:var(--surface2); color:var(--text-primary); }
    .proj-item.active { background:#eef0ff; color:var(--accent); font-weight:500; }
    .proj-item.active::before { content:''; position:absolute; inset-inline-start:0; top:8px; bottom:8px; width:3px; border-radius:3px; background:var(--grad); }
    .proj-item-name { flex:1; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .proj-del { display:none; color:var(--text-muted); font-size:11px; flex-shrink:0; background:none; border:none; cursor:pointer; padding:0 2px; line-height:1; }
    .proj-item:hover .proj-del, .proj-item.active .proj-del { display:block; }
    .proj-del:hover { color:var(--red)!important; }
    .proj-edit:hover { color:var(--accent)!important; }
    .main { flex:1; min-width:0; }
    .add-form { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:24px; }
    .form-row { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
    .form-row:last-child { margin-bottom:0; }
    input, textarea, select { background:var(--surface2); border:1px solid transparent; border-radius:10px; color:var(--text-primary); font-family:inherit; font-size:14px; padding:10px 14px; outline:none; transition:border-color 0.15s, box-shadow 0.15s; width:100%; text-align:right; }
    input::placeholder, textarea::placeholder { color:var(--text-muted); }
    input:focus, textarea:focus, select:focus { background:var(--surface); border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,108,255,0.15); }
    textarea { resize:vertical; min-height:56px; }
    select { direction:rtl; }
    .form-row input.title-input { flex:1; }
    .date-wrap { position:relative; flex-shrink:0; }
    .date-wrap input[type="date"] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; z-index:2; color-scheme:light; }
    .date-display { background:var(--surface2); border:1px solid transparent; border-radius:10px; color:var(--text-muted); font-size:13px; padding:10px 14px; white-space:nowrap; display:flex; align-items:center; gap:6px; min-width:140px; user-select:none; cursor:pointer; }
    .check { display:flex; align-items:center; gap:6px; flex-shrink:0; font-size:13px; color:var(--text-secondary); cursor:pointer; white-space:nowrap; user-select:none; }
    .check input { width:16px; height:16px; padding:0; accent-color:var(--accent); cursor:pointer; }
    .date-display.has-date { background:#eef0ff; color:var(--accent); border-color:var(--border-hover); }
    .btn { background:var(--grad); border:none; border-radius:10px; box-shadow:0 4px 12px rgba(91,108,255,0.3); color:#fff; cursor:pointer; font-family:inherit; font-size:14px; font-weight:500; padding:10px 20px; transition:opacity 0.15s, transform 0.15s; white-space:nowrap; }
    .btn:hover { opacity:0.92; transform:translateY(-1px); }
    .btn-ghost { background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--text-secondary); cursor:pointer; font-family:inherit; font-size:14px; padding:10px 14px; transition:all 0.15s; white-space:nowrap; }
    .btn-ghost:hover { border-color:var(--border-hover); color:var(--accent); }
    .btn-rec { display:inline-flex; align-items:center; justify-content:center; gap:6px; }
    .btn-rec.recording { border-color:var(--pink); color:var(--pink); animation:recpulse 1.2s ease-in-out infinite; }
    .btn-rec:disabled { opacity:0.5; cursor:wait; }
    @keyframes recpulse { 50% { background:rgba(232,79,166,0.1); } }
    .filters { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .filter-btn { background:var(--surface); border:none; border-radius:20px; box-shadow:var(--shadow); color:var(--text-secondary); cursor:pointer; font-family:inherit; font-size:13px; padding:7px 16px; transition:all 0.15s; }
    .filter-btn:hover { color:var(--accent); }
    .filter-btn.active { background:var(--grad); color:#fff; }
    .section-label { font-size:12px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-secondary); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .section-label .count { background:#eef0ff; border-radius:10px; font-size:11px; padding:1px 8px; color:var(--accent); }
    .task-group { margin-bottom:28px; }
    .task-item { background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:14px; padding-inline-start:20px; margin-bottom:10px; display:flex; align-items:flex-start; gap:12px; position:relative; transition:box-shadow 0.15s, transform 0.15s; }
    .task-item::before { content:''; position:absolute; inset-inline-start:0; top:14px; bottom:14px; width:4px; border-radius:4px; background:var(--grad); }
    .task-item:hover { box-shadow:0 10px 28px rgba(70,82,160,0.14); transform:translateY(-1px); }
    .task-item.done { opacity:0.55; }
    .task-item.done::before { background:var(--border-hover); }
    .checkbox { width:22px; height:22px; border:2px solid var(--border-hover); border-radius:50%; flex-shrink:0; margin-top:1px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; }
    .checkbox:hover { border-color:var(--accent); }
    .checkbox.checked { background:var(--grad); border-color:transparent; }
    .checkbox.checked::after { content:''; width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(-45deg) translateY(-1px); }
    .task-icon { width:40px; height:40px; flex-shrink:0; border-radius:12px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:22px; line-height:1; }
    .task-body { flex:1; min-width:0; cursor:pointer; }
    .task-title { font-size:15px; font-weight:500; color:var(--text-primary); line-height:1.4; }
    .task-item.done .task-title { text-decoration:line-through; color:var(--text-secondary); }
    .tag.more { color:var(--text-secondary); background:var(--surface2); }
    .detail-modal { width:480px; }
    .detail-title { font-size:20px; font-weight:600; line-height:1.4; margin-bottom:12px; }
    .detail-desc { font-size:14px; color:var(--text-secondary); line-height:1.7; white-space:pre-wrap; margin-bottom:16px; }
    .detail-desc.empty-desc { color:var(--text-muted); }
    .detail-modal .task-meta { margin:0 0 20px; }
    .task-meta { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:center; }
    .tag { font-size:11px; font-weight:500; padding:3px 9px; border-radius:20px; border:none; }
    .tag.high { color:#c2327f; background:#fde8f3; }
    .tag.due { color:#3b63e0; background:#e8efff; }
    .tag.overdue { color:var(--red); background:#fde8ec; }
    .tag.project { color:#7c3fd6; background:#f1e9fe; }
    .tag.cal { color:#3b63e0; background:#e8efff; cursor:pointer; display:inline-flex; align-items:center; gap:3px; font-family:inherit; }
    .tag.cal:hover { background:#d8e3ff; }
    .tag.repeat { color:#0f8a6a; background:#e3f7f0; }
    .tag.gmail { color:#b7791f; background:#fef4dc; text-decoration:none; }
    .ov { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; }
    .ov-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
    .ov-head { font-size:11px; font-weight:600; color:var(--text-muted); text-align:center; padding-bottom:2px; }
    .ov-day { background:var(--surface2); border-radius:10px; min-height:72px; padding:6px; display:flex; flex-direction:column; gap:5px; }
    .ov-day.past { opacity:0.45; }
    .ov-day.today { background:#eef0ff; box-shadow:inset 0 0 0 2px var(--accent); }
    .ov-date { display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary); }
    .ov-count { font-weight:600; color:var(--accent); }
    .ov-dots { display:flex; flex-wrap:wrap; gap:4px; }
    .dot { display:inline-block; width:12px; height:12px; border:none; border-radius:50%; padding:0; background:var(--grad); cursor:pointer; }
    .dot.overdue { background:var(--red); }
    .dot.undated { background:transparent; box-shadow:inset 0 0 0 2px var(--accent); }
    .ov-more { margin-top:10px; font-size:12px; color:var(--text-muted); }
    .ov-legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:12px; font-size:12px; color:var(--text-secondary); }
    .ov-legend .dot { cursor:default; margin-inline-end:5px; vertical-align:-1px; }
    .signout-btn { margin-inline-start:auto; }
    .login-screen { display:none; text-align:center; padding:80px 0; }
    body.signed-out .login-screen { display:block; }
    body.signed-out .app, body.signed-out .signout-btn, body.signed-out .speak-btn { display:none; }
    .task-actions { flex-shrink:0; display:flex; flex-direction:column; gap:4px; }
    .icon-btn { background:transparent; border:none; border-radius:6px; color:var(--text-muted); cursor:pointer; font-size:13px; padding:4px; transition:all 0.15s; line-height:1; }
    .icon-btn:hover { color:var(--red); background:#fde8ec; }
    .icon-btn.edit:hover { color:var(--accent); background:#eef0ff; }
    .empty { text-align:center; padding:48px 0; color:var(--text-muted); font-size:14px; background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(31,37,68,0.35); backdrop-filter:blur(4px); z-index:200; align-items:center; justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--surface); border-radius:20px; box-shadow:0 20px 60px rgba(31,37,68,0.2); padding:26px; width:380px; max-width:95vw; }
    .modal h2 { font-size:17px; font-weight:600; margin-bottom:16px; }
    .modal .form-row { margin-bottom:10px; }
    .modal .form-row:last-child { margin-bottom:0; }
    .modal-row { display:flex; gap:8px; }
    .toast { position:fixed; bottom:24px; left:24px; background:var(--surface); border-radius:14px; box-shadow:0 12px 36px rgba(31,37,68,0.18); color:var(--text-primary); font-size:14px; padding:14px 16px; opacity:0; pointer-events:none; transform:translateY(8px); transition:all 0.2s; z-index:100; min-width:200px; }
    .toast.show { opacity:1; pointer-events:auto; transform:translateY(0); }
    .loading { color:var(--text-muted); font-size:14px; padding:20px 0; }
    @media (max-width:620px) {
      .app { flex-direction:column; }
      .sidebar { width:100%; position:static; }
      .proj-list { flex-direction:row; flex-wrap:wrap; gap:6px; }
      .proj-item { width:auto; }
      .form-row { flex-direction:column; }
      .date-wrap { width:100%; }
      .date-display { min-width:unset; }
      body { padding:24px 16px 60px; }
      .toast { left:16px; right:16px; bottom:16px; }
    }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="icon.svg" alt=""/>
    <div>
      <div class="header-label">kess-task</div>
      <h1>המשימות <span>שלי</span></h1>
    </div>
    <button class="btn-ghost signout-btn" onclick="signOut()">התנתק</button>
    <button class="btn speak-btn" onclick="speakToday()" title="הקרא את המשימות של היום">🔊 היום</button>
  </header>

  <div class="login-screen">
    <button class="btn" onclick="signIn()">התחבר עם Google</button>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <button class="proj-add-btn" onclick="openAddProject()" title="פרויקט חדש">+</button>
        <span class="sidebar-label">פרויקטים</span>
      </div>
      <div class="proj-list" id="projList"></div>
    </aside>

    <div class="main">
      <div class="add-form">
        <div class="form-row">
          <input id="titleInput" class="title-input" type="text" placeholder="כותרת המשימה..." autocomplete="off"/>
          <button class="btn-ghost btn-rec" id="recBtn" onclick="toggleRecording()" title="הקלט משימה">🎤 הקלט</button>
          <label class="btn-ghost btn-rec" title="צלם או צרף תמונה"><span id="photoLabel">📷 תמונה</span><input id="photoInput" type="file" accept="image/*" hidden onchange="onPhoto(this)"/></label>
          <button class="icon-btn" id="photoClear" hidden onclick="clearPhoto()" title="הסר תמונה">✕</button>
        </div>
        <div class="form-row">
          <textarea id="descInput" placeholder="פרטים (אופציונלי)"></textarea>
        </div>
        <div class="form-row">
          <label class="check"><input id="highInput" type="checkbox"/>🔥 עדיפות גבוהה</label>
          <div class="date-wrap">
            <div class="date-display" id="dateDisplay">
              <span>📅</span>
              <span id="dateLabel">תאריך יעד</span>
            </div>
            <input id="dueDateInput" type="date" onchange="onDateChange(this)"/>
          </div>
          <label class="check"><input id="repeatInput" type="checkbox"/>🔁 כל שבוע</label>
          <label class="check"><input id="calInput" type="checkbox"/>📆 הוסף ליומן</label>
          <button class="btn" onclick="addTask()">הוסף</button>
        </div>
      </div>

      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('active',this)">פעיל</button>
        <button class="filter-btn" onclick="setFilter('done',this)">הושלם</button>
        <button class="filter-btn" onclick="setFilter('high',this)">עדיפות גבוהה</button>
        <button class="filter-btn" onclick="setFilter('overview',this)">📅 סקירה</button>
      </div>

      <div id="taskList"><div class="loading">טוען...</div></div>
    </div>
  </div>

  <!-- Add Project Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeAddProject(event)">
    <div class="modal">
      <h2 id="projModalTitle">פרויקט חדש</h2>
      <div class="modal-row">
        <input id="projNameInput" type="text" placeholder="שם פרויקט..." autocomplete="off"/>
        <button class="btn" id="projSaveBtn" onclick="addProject()">הוסף</button>
        <button class="btn-ghost" onclick="closeAddProject()">ביטול</button>
      </div>
    </div>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal-overlay" id="editModalOverlay" onclick="closeEditTask(event)">
    <div class="modal">
      <h2>עריכת משימה</h2>
      <div class="form-row">
        <input id="editTitleInput" type="text" placeholder="כותרת..." autocomplete="off"/>
      </div>
      <div class="form-row">
        <textarea id="editDescInput" placeholder="פרטים (אופציונלי)"></textarea>
      </div>
      <div class="form-row">
        <label class="check"><input id="editHighInput" type="checkbox"/>🔥 עדיפות גבוהה</label>
        <label class="check"><input id="editRepeatInput" type="checkbox"/>🔁 כל שבוע</label>
      </div>
      <div class="form-row">
        <div class="date-wrap" style="width:100%">
          <div class="date-display" id="editDateDisplay" style="min-width:unset;width:100%">
            <span>📅</span>
            <span id="editDateLabel">תאריך יעד</span>
          </div>
          <input id="editDueDateInput" type="date" onchange="onEditDateChange(this)"/>
        </div>
      </div>
      <div class="form-row">
        <select id="editProjectInput"></select>
      </div>
      <div class="modal-row">
        <button class="btn" onclick="saveEdit()">שמור</button>
        <button class="btn-ghost" onclick="closeEditTask()">ביטול</button>
      </div>
    </div>
  </div>

  <!-- Task Details Modal -->
  <div class="modal-overlay" id="detailOverlay" onclick="closeDetail(event)">
    <div class="modal detail-modal">
      <div class="detail-title" id="detailTitle"></div>
      <div class="detail-desc" id="detailDesc"></div>
      <div class="task-meta" id="detailMeta"></div>
      <div class="modal-row">
        <button class="btn" onclick="editFromDetail()">ערוך</button>
        <button class="btn-ghost" onclick="closeDetail()">סגור</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <div id="toastMsg"></div>
  </div>

  <script>
    var tasks=[], projects=[], filter='active', currentProject='all';
    var toastTimer=null;
    var editingId=null, detailId=null, renamingProjectId=null;
    var sb=supabase.createClient('https://qmbdtswkeaayvsufphav.supabase.co','sb_publishable_VSAG1svbd57fNRlQ1r_r5A_cEPgU2nM');
    var loaded=false;
    // Apps Script web app: turns a voice memo into headline, details and due date.
    var SCRIPT_URL='https://script.google.com/macros/s/AKfycbza0DRcMq4tm4bfG9DznuBfXq2IuPXg4rdLb299PDS_a92VqCzNzrjzme2U40H4ort0Dw/exec';
    var MAX_RECORDING_MS=120000;
    var recorder=null, recTimer=null;
    var photo=null;   // the attached picture { data, mimeType }, also sent with a recording

    function must(r) { if (r.error) throw new Error(r.error.message); return r.data; }
    function signIn() { sb.auth.signInWithOAuth({provider:'google', options:{redirectTo:location.origin+location.pathname}}); }
    async function signOut() { await sb.auth.signOut(); }

    function gcalUrl(title, date, desc) {
      var d = date.replace(/-/g,'');
      return 'https://calendar.google.com/calendar/r/eventedit'
        +'?text='+encodeURIComponent(title)
        +'&dates='+d+'T080000/'+d+'T090000'
        +(desc?'&details='+encodeURIComponent(desc):'');
    }

    function openCalTag(url) { location.href = url; }

    function onDateChange(input) {
      var lbl=document.getElementById('dateLabel'), disp=document.getElementById('dateDisplay');
      if (input.value) {
        var p=input.value.split('-');
        lbl.textContent=p[2]+'/'+p[1]+'/'+p[0].slice(2);
        disp.classList.add('has-date');
      } else {
        lbl.textContent='תאריך יעד';
        disp.classList.remove('has-date');
      }
    }

    function onEditDateChange(input) {
      var lbl=document.getElementById('editDateLabel'), disp=document.getElementById('editDateDisplay');
      if (input.value) {
        var p=input.value.split('-');
        lbl.textContent=p[2]+'/'+p[1]+'/'+p[0].slice(2);
        disp.classList.add('has-date');
      } else {
        lbl.textContent='תאריך יעד';
        disp.classList.remove('has-date');
      }
    }

    function toast(msg) {
      if (toastTimer) clearTimeout(toastTimer);
      document.getElementById('toastMsg').textContent = msg;
      var el = document.getElementById('toast');
      el.classList.add('show');
      toastTimer = setTimeout(function(){el.classList.remove('show');}, 2400);
    }

    async function load() {
      try {
        var [pRes,tRes]=await Promise.all([
          sb.from('projects').select('*').order('created_at',{ascending:true}),
          sb.from('tasks').select('*').order('created_at',{ascending:false})
        ]);
        projects=must(pRes); tasks=must(tRes);
        renderSidebar(); render();
      } catch(e) { document.getElementById('taskList').innerHTML='<div class="empty">לא ניתן לטעון משימות</div>'; }
    }

    function renderSidebar() {
      var list=document.getElementById('projList');
      list.innerHTML='';

    // A fantasy icon for what a task is about, from keywords in its headline and details.

    function fantasyIcon(t){

    // Open tasks by day, for the overview tab and read-aloud. Overdue tasks sit on today;
    // undated ones are spread over the next 7 days for display only, nothing is saved.
    function spreadUndated(counts,undated){
      // Each undated task goes to the least busy day, the earliest on a tie.
      return undated.map(function(){
        var i=counts.indexOf(Math.min.apply(null,counts)); counts[i]++; return i;
      });
    }
    console.assert(JSON.stringify(spreadUndated([3,0,1,0,2,0,0],[1,2,3,4,5]))==='[1,3,5,6,1]','spreadUndated');
    function dayKey(d){return d.toLocaleDateString('sv-SE');}
    function addDays(d,n){var x=new Date(d); x.setDate(x.getDate()+n); return x;}
    function tasksByDay(today){
      var todayKey=dayKey(today), byDay={}, undated=[];
      var put=function(k,t,kind){(byDay[k]=byDay[k]||[]).push({t:t,kind:kind});};
      tasks.forEach(function(t){
        if(t.status==='done') return;
        var d=t.due_date?t.due_date.split('T')[0]:null;
        if(!d) undated.push(t); else if(d<todayKey) put(todayKey,t,'overdue'); else put(d,t,'due');
      });
      var week=[0,1,2,3,4,5,6].map(function(i){return dayKey(addDays(today,i));});
      spreadUndated(week.map(function(k){return (byDay[k]||[]).length;}),undated)
        .forEach(function(i,j){put(week[i],undated[j],'undated');});
      return byDay;
    }
    function overviewHtml(){
      var MAX_WEEKS=8, dayNames=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
      var today=new Date(new Date().toDateString()), todayKey=dayKey(today), byDay=tasksByDay(today);
      var start=addDays(today,-today.getDay());
      var lastKey=Object.keys(byDay).sort().pop()||todayKey;
      var span=Math.round((new Date(lastKey+'T00:00')-start)/864e5);
      var weeks=Math.min(MAX_WEEKS,Math.max(2,Math.ceil((span+1)/7)));
      var endKey=dayKey(addDays(start,weeks*7-1));
      var h='<div class="ov"><div class="ov-grid">';
      dayNames.forEach(function(n){h+='<div class="ov-head">'+n+'</div>';});
      for(var i=0;i<weeks*7;i++){
        var d=addDays(start,i), k=dayKey(d), items=byDay[k]||[];
        h+='<div class="ov-day'+(k<todayKey?' past':'')+(k===todayKey?' today':'')+'">';
        h+='<div class="ov-date"><span>'+d.getDate()+'/'+(d.getMonth()+1)+'</span>'+(items.length?'<span class="ov-count">'+items.length+'</span>':'')+'</div><div class="ov-dots">';
        items.forEach(function(it){
          h+='<button class="dot '+it.kind+'" title="'+esc(it.t.title)+'" aria-label="'+esc(it.t.title)+'" onclick="openDetail(\''+it.t.id+'\')"></button>';
        });
        h+='</div></div>';
      }
      h+='</div>';
      var later=Object.keys(byDay).filter(function(k){return k>endKey;}).reduce(function(n,k){return n+byDay[k].length;},0);
      if(later) h+='<div class="ov-more">ועוד '+later+' משימות מאוחר יותר</div>';
      h+='<div class="ov-legend"><span><span class="dot due"></span>תאריך יעד</span><span><span class="dot undated"></span>בלי תאריך (שובץ לתצוגה)</span><span><span class="dot overdue"></span>באיחור</span></div>';
      return h+'</div>';
    }
    // Reads today's tasks aloud, e.g. in the car. Pressing again stops.
    function speakToday(){
      var synth=window.speechSynthesis;
      if(!synth){ toast('הדפדפן לא תומך בהקראה'); return; }
      if(synth.speaking){ synth.cancel(); return; }
      var today=new Date(new Date().toDateString());
      var items=tasksByDay(today)[dayKey(today)]||[];
      var lines=[items.length===0?'אין משימות להיום.':items.length===1?'יש לך משימה אחת להיום.':'יש לך '+items.length+' משימות להיום.'];
      items.forEach(function(it){ lines.push((it.kind==='overdue'?'באיחור: ':'')+it.t.title+'.'); });
      var voice=synth.getVoices().find(function(v){return /^he/i.test(v.lang);});
      // One utterance per line: Chrome cuts off long ones.
      lines.forEach(function(line){
        var u=new SpeechSynthesisUtterance(line);
        u.lang='he-IL'; if(voice) u.voice=voice;
        synth.speak(u);
      });
    }

    function setRecState(state){
      var b=document.getElementById('recBtn');
      b.classList.toggle('recording',state==='recording');
      b.disabled=state==='busy';

    async function toggleRecording(){
      if(recorder&&recorder.state==='recording'){ recorder.stop(); return; }
      if(!navigator.mediaDevices||!window.MediaRecorder){ toast('הדפדפן לא תומך בהקלטה'); return; }
      var stream;
      try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
      catch(e){ toast('אין גישה למיקרופון'); return; }
      var chunks=[];
      recorder=new MediaRecorder(stream);
      recorder.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
      recorder.onstop=function(){
        clearTimeout(recTimer);
        stream.getTracks().forEach(function(tr){ tr.stop(); });
        var type=(recorder.mimeType||'audio/webm').split(';')[0];
        sendRecording(new Blob(chunks,{type:type}));
      };
      recorder.start();
      setRecState('recording');
      recTimer=setTimeout(function(){ if(recorder&&recorder.state==='recording') recorder.stop(); },MAX_RECORDING_MS);
    }
    function blobToBase64(blob){
      return new Promise(function(resolve,reject){
        var r=new FileReader();
        r.onload=function(){ resolve(String(r.result).split(',')[1]||''); };
        r.onerror=reject;
        r.readAsDataURL(blob);
      });
    }
    async function sendRecording(blob){
      if(!blob.size){ recorder=null; setRecState('idle'); toast('ההקלטה ריקה'); return; }
      var fields={mimeType:blob.type, audio:await blobToBase64(blob)};
      if(photo){ fields.image=photo.data; fields.imageMimeType=photo.mimeType; }
      await draftTask(fields);
    }
    async function onPhoto(input){
      var file=input.files[0];
      input.value='';
      if(!file) return;
      try{ photo=await shrinkImage(file); }
      catch(e){ toast('לא ניתן לקרוא את התמונה'); return; }
      setPhotoState();
      await draftTask({image:photo.data, imageMimeType:photo.mimeType});
    }
    function clearPhoto(){ photo=null; setPhotoState(); }
    function setPhotoState(){
      document.getElementById('photoLabel').textContent=photo?'📷 ✓ מצורפת':'📷 תמונה';
      document.getElementById('photoClear').hidden=!photo;
    }
    // Phone photos are several MB; a 1600px JPEG is plenty to read and quick to send.
    function shrinkImage(file){
      return new Promise(function(resolve,reject){
        var img=new Image(), url=URL.createObjectURL(file);
        img.onload=function(){
          var scale=Math.min(1,1600/Math.max(img.width,img.height));
          var c=document.createElement('canvas');
          c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          URL.revokeObjectURL(url);
          resolve({data:c.toDataURL('image/jpeg',0.85).split(',')[1], mimeType:'image/jpeg'});
        };
        img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('unreadable image')); };
        img.src=url;
      });
    }
    // Sends a recording and/or picture, plus whatever is already typed, and fills the form with the draft.
    async function draftTask(fields){
      setRecState('busy');

        var session=(await sb.auth.getSession()).data.session;
        if(!session) throw new Error('יש להתחבר מחדש');
        var typed=[document.getElementById('titleInput').value,document.getElementById('descInput').value]
          .map(function(v){return v.trim();}).filter(Boolean).join('\n');
        var res=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(Object.assign({
          action:'draftTask', accessToken:session.access_token, text:typed
        },fields))});
        var out=await res.json();
        if(!out.ok) throw new Error(out.error||'שגיאה');
        var r=out.result;
        document.getElementById('titleInput').value=r.title||'';
        document.getElementById('descInput').value=r.description||'';
        var dateInput=document.getElementById('dueDateInput');
        dateInput.value=r.due_date||'';
        onDateChange(dateInput);
        document.getElementById('titleInput').focus();
        toast('בדוק את המשימה ולחץ הוסף');
      }catch(e){ toast('לא הצלחתי ליצור משימה: '+e.message); }
      finally{ recorder=null; setRecState('idle'); }
    }
    async function addTask(){
      var title=document.getElementById('titleInput').value.trim();
      if(!title){toast('הכנס כותרת משימה');return;}
      var dueDate=document.getElementById('dueDateInput').value;
      var desc=document.getElementById('descInput').value.trim()||null;
      var cal=document.getElementById('calInput').checked, repeat=document.getElementById('repeatInput').checked;
      if(repeat&&!dueDate){toast('בחר תאריך למשימה החוזרת');return;}
      if(cal&&!dueDate){toast('בחר תאריך יעד כדי להוסיף ליומן');return;}
      var payload={title:title,description:desc,priority:document.getElementById('highInput').checked?'high':'normal',repeat_weekly:repeat,due_date:dueDate||null,project_id:currentProject!=='all'?currentProject:null};
      try{
        var task=must(await sb.from('tasks').insert([payload]).select().single());
        tasks.unshift(task);
        document.getElementById('titleInput').value='';
        document.getElementById('descInput').value='';
        document.getElementById('dueDateInput').value='';
        document.getElementById('highInput').checked=false;
        document.getElementById('repeatInput').checked=false;
        onDateChange(document.getElementById('dueDateInput'));
        render();
        document.getElementById('calInput').checked=false;
        clearPhoto();
        toast('משימה נוספה');
        if(cal) location.href=gcalUrl(title,dueDate,desc);
      }catch(e){toast('שגיאה: '+e.message);}
    }
    async function toggle(id,wasDone){
      try{
        var updated=must(await sb.from('tasks').update({status:wasDone?'todo':'done'}).eq('id',id).select().single());
        tasks=tasks.map(function(t){return t.id===id?updated:t;});
        if(!wasDone&&updated.repeat_weekly&&updated.due_date) await addNextWeek(updated);
        render();
      }catch(e){toast('שגיאה');}
    }
    // A weekly task that is done comes back on the same weekday, the first one from today on.
    async function addNextWeek(t){
      var today=dayKey(new Date()), next=new Date(t.due_date.split('T')[0]+'T00:00');
      do { next=addDays(next,7); } while(dayKey(next)<today);
      var due=dayKey(next);
      // Ticking, unticking and ticking again must not add the same week twice.
      if(tasks.some(function(x){return x.repeat_weekly&&x.title===t.title&&x.due_date===due;})) return;
      var copy=must(await sb.from('tasks').insert([{title:t.title,description:t.description,priority:t.priority,
        project_id:t.project_id,repeat_weekly:true,due_date:due}]).select().single());
      tasks.unshift(copy);
      toast('המשימה תחזור ב-'+fmtDate(due));
    }
    async function del(id){
      try{
        must(await sb.from('tasks').delete().eq('id',id));
        tasks=tasks.filter(function(t){return t.id!==id;}); render(); toast('נמחק');
      }catch(e){toast('שגיאה');}
    }
    document.getElementById('titleInput').addEventListener('keydown',function(e){if(e.key==='Enter')addTask();});
    document.getElementById('projNameInput').addEventListener('keydown',function(e){
      if(e.key==='Enter')addProject();
      if(e.key==='Escape')closeAddProject();
    });
    document.getElementById('editTitleInput').addEventListener('keydown',function(e){
      if(e.key==='Enter')saveEdit();
      if(e.key==='Escape')closeEditTask();
    });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&detailId) closeDetail(); });
    sb.auth.onAuthStateChange(function(event, session) {
      document.body.classList.toggle('signed-out', !session);
      if (!session) { loaded=false; tasks=[]; projects=[]; return; }
      if (!loaded) { loaded=true; setTimeout(load, 0); }
    });
  </script>
</body>
